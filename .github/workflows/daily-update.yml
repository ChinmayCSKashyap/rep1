name: Daily Update by 23f2001372@ds.study.iitm.ac.in

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC (specific time, not wildcard)
  workflow_dispatch:      # Lets you trigger manually for testing

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create daily update by 23f2001372@ds.study.iitm.ac.in
        run: |
          echo "$(date): Daily automated update" >> status.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.txt
          git commit -m "Daily update: $(date)"
          git push
